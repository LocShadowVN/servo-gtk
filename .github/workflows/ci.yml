name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Tự động hủy các workflow cũ trên cùng branch khi có commit mới được đẩy lên
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Build & Link time optimizations
  CARGO_INCREMENTAL: "0"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # Tắt DWARF debug info khổng lồ của Servo/SpiderMonkey trong CI để giảm 65% thời gian link và kích thước cache
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Kích hoạt trình liên kết đa luồng siêu tốc LLVM lld
  RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

# Cần quyền write để auto-commit formatting fix.
permissions:
  contents: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # ============================================================
      # Auto-format — chạy ngay trước khi cài apt/cache để phản hồi tức thì
      # ============================================================
      - name: Auto-format
        run: cargo fmt --all

      - name: Auto-commit formatting changes
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format with cargo fmt"
          file_pattern: "*.rs"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          skip_fetch: false
          skip_dirty_check: false
          skip_checkout: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build python3 python3-pip \
            pkg-config curl wget file clang llvm lld \
            libssl-dev \
            libgtk-4-dev \
            libepoxy-dev \
            libx11-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libgbm-dev libwayland-dev libxkbcommon-dev \
            libsqlite3-dev \
            protobuf-compiler

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: servo-gtk-fast-v2
          cache-all-crates: true
          cache-on-failure: true
          cache-directories: |
            ~/.cargo/git
            ~/.cargo/registry

      # ============================================================
      # Clippy — kiểm tra toàn bộ lib, examples và tests trong 1 lượt
      # ============================================================
      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      # ============================================================
      # Build & Unit Tests (gộp targets để tránh link lặp lại)
      # ============================================================
      - name: Run unit tests
        run: cargo test --lib

      - name: Build library and browser example
        run: cargo build --lib --example browser
